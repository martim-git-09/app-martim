function gradeRes(name){
  const sp=SPEC[name],g=S.grades[name]||{};
  for(const f of sp.f){const v=nv(g,f.k);if(v!==null&&(v<0||v>f.max))return `<span class="text-[#ff453a]">Nota fora do intervalo: ${f.l}</span>`}
  const r=sp.calc(g),fm=n=>n.toFixed(2).replace('.',','),warns=[...(r.warns||[])];
  const rows=(r.parts||[]).map(p=>{const bad=p[2]!=null&&p[1]!==null&&p[1]<p[2];if(bad)warns.push(p[0]+' abaixo do mínimo ('+fm(p[2])+')');
    return `<div class="flex justify-between gap-2 text-xs py-0.5"><span class="text-gray-400">${p[0]}${p[2]!=null?' · mín. '+fm(p[2]):''}</span><span class="font-semibold shrink-0 ${bad?'text-[#ff453a]':''}">${p[1]===null?'—':fm(p[1])+(p[3]?'/'+p[3]:'')}</span></div>`}).join('');
  let main,final=null;
  const tv=r.exact!==undefined?null:(r.tv!==undefined?r.tv:nv(g,r.tk));
  if(r.exact!==undefined)final=r.exact;
  else if(tv!==null){final=r.base+r.tw*tv;if(r.tmin&&tv<r.tmin)warns.push(r.tl+' abaixo do mínimo ('+fm(r.tmin)+')')}
  if(final!==null){const ok=final>=P&&!warns.length;
    main=`<div class="text-base font-bold ${ok?'text-[#30d158]':'text-[#ff453a]'}">Nota final: ${fm(final)} → ${Math.floor(final+.5)} ${ok?'✅':''}</div>`+(final<P?'<div class="text-xs text-[#ff453a]">Abaixo de 9,5 — sem aprovação.</div>':'')}
  else{const tmax=r.tmax||20,need=Math.max((P-r.base)/r.tw,r.tmin||0,0);
    main=(need>tmax?`<div class="text-[#ff453a] font-semibold">Já não dá para passar: precisavas de ${fm(need)} (máx. ${tmax}).</div>`
      :need===0?'<div class="text-[#30d158] font-semibold">Já tens a nota para passar 🎉</div>'
      :`<div class="text-[#30d158] font-semibold">Precisas de pelo menos ${fm(Math.ceil(need*100)/100)}/${tmax} em: ${r.tl}</div>`)
      +(r.hint&&need<=tmax?`<div class="text-xs text-gray-400 mt-1">${r.hint(need)}</div>`:'')
      +`<div class="text-xs text-gray-400 mt-1">Pontos já garantidos: ${fm(r.base)} (de 20)</div>`}
  let out=main;
  if(rows)out+=`<div class="mt-2 pt-2 border-t border-[#2c2c2e]">${rows}</div>`;
  warns.forEach(w=>out+=`<div class="text-[#ff9f0a] text-xs mt-1">⚠️ ${w}</div>`);
  if(r.miss&&r.miss.length)out+=`<div class="text-gray-500 text-xs mt-1">Sem notas em: ${r.miss.join(', ')} (contam 0).</div>`;
  return out;
}
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function streak(field){
  const done=x=>{const r=S.daily[ymd(x)];return !!(r&&r[field])};
  const d=new Date(now);let n=0;
  if(!done(d))d.setDate(d.getDate()-1);

    else if(field==='gym'&&![2,3,4,5].includes(d.getDay())){}
    else break;
    d.setDate(d.getDate()-1);
  }

}

  const it=t=>`<div class="flex items-center justify-between p-2.5 rounded-xl"><div data-a="tgs" data-v="${t.id}" class="flex items-center gap-3 flex-1 min-w-0">${cb(t.done,'bg-[#30d158] border-[#30d158]','tgs',t.id)}<span class="text-[15px] break-words min-w-0 ${t.done?'text-gray-500 line-through':''}">${esc(t.text)}</span></div><button data-a="dels" data-v="${t.id}" class="p-2 text-red-500 shrink-0">${icon('trash',16)}</button></div>`;
  const dish=m=>`<div class="p-3 bg-[#2c2c2e]/50 rounded-xl"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="font-semibold text-[15px] break-words">${esc(m.name)}</div></div><button data-a="delm" data-v="${m.id}" class="p-1.5 text-red-500 shrink-0">${icon('trash',16)}</button></div></div>`;
  return head('Comida','Compras e receitas')+(flash?`<div class="mb-4 p-3 rounded-xl bg-[#30d158]/15 text-[#30d158] text-sm font-medium">${flash}</div>`:'')+`<div class="space-y-4">
  <div class="${card}"><div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold text-[#30d158]">🛒 Compras</h2>${done.length?`<button data-a="clrs" class="text-xs font-semibold text-gray-400">Limpar comprados (${done.length})</button>`:''}</div>
    <div class="space-y-1 mb-3">${[...open,...done].map(it).join('')||'<p class="text-gray-500 text-sm text-center py-6">Lista vazia</p>'}</div>
    <div class="relative"><input id="sItem" data-enter="adds" placeholder="Adicionar à lista..." class="${inp} pr-12"><button data-a="adds" class="absolute right-1.5 top-1.5 bottom-1.5 w-9 bg-[#30d158] text-black rounded-lg flex items-center justify-center">${icon('plus',18,3)}</button></div></div>
  <div class="${card}"><h2 class="text-lg font-semibold mb-3 text-[#ff9f0a]">🍳 Pratos do Chefe Martim</h2>
    <div class="space-y-2 mb-4">${S.dishes.map(dish).join('')||'<p class="text-gray-500 text-sm text-center py-4">Ainda não há pratos. Adiciona o primeiro!</p>'}</div>
    <div class="flex gap-2"><input id="mName" data-enter="addm" placeholder="Nome do prato" class="${inp} flex-1"><button data-a="addm" class="w-12 shrink-0 bg-[#ff9f0a] text-black rounded-xl flex items-center justify-center">${icon('plus',20,3)}</button></div></div></div>`;
},
uni(){
  const calc=(s,i)=>{const sp=SPEC[s[0]],g=S.grades[s[0]]||{};let last='',ins='';
    sp.f.forEach(f=>{if(f.grp&&f.grp!==last){ins+=`<div class="col-span-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mt-2">${f.grp}</div>`;last=f.grp}
      ins+=`<label class="block"><span class="text-[11px] text-gray-400">${f.l}</span><input data-g="${i}|${f.k}" inputmode="decimal" value="${esc(g[f.k]==null?'':g[f.k])}" placeholder="—" class="${inp} mt-1"></label>`});
    const dyn=(g.dyn||[]).map(x=>`<div class="flex items-center justify-between gap-2 p-2 pl-3 bg-[#2c2c2e]/50 rounded-xl text-sm"><span class="min-w-0 break-words">${esc(x.t)}</span><span class="flex items-center gap-1 shrink-0"><b>${esc(x.v)}</b><button data-a="gdel" data-v="${i}|${x.id}" class="p-1.5 text-red-500">${icon('trash',14)}</button></span></div>`).join('');
    return `<details data-d="${i}" ${openD[i]?'open':''} class="mt-3 pt-3 border-t border-[#2c2c2e]"><summary class="text-sm font-semibold text-[#0a84ff] cursor-pointer">🎯 Notas e calculadora</summary>
      <div class="grid grid-cols-2 gap-2 mt-2">${ins}</div>
      <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-4 mb-2">${sp.dynTitle||'📝 Outras notas (só registo)'}</div>
      <div class="space-y-1.5 mb-2">${dyn}</div>
      <div class="flex gap-2"><input id="gn_${i}" placeholder="Nome (ex: Mini-teste)" class="${inp} flex-1"><div style="width:76px" class="shrink-0"><input id="gv_${i}" inputmode="decimal" placeholder="Nota" class="${inp}"></div><button data-a="gadd" data-v="${i}" class="w-11 shrink-0 bg-[#0a84ff] text-white rounded-xl flex items-center justify-center">${icon('plus',18,3)}</button></div>
      <div id="res_${i}" class="mt-4 p-3 bg-[#2c2c2e] rounded-xl text-sm leading-snug">${gradeRes(s[0])}</div>
      <div class="text-[11px] text-gray-500 mt-2">Aprovação com nota final ≥ 9,5 (arredonda a 10).</div></details>`};
  return head('Universidade','Métodos de avaliação')+`<div class="space-y-4">${SUBJECTS.map((s,i)=>`<div class="${card}"><h3 class="text-lg font-bold leading-tight mb-3 pb-3 border-b border-[#2c2c2e]">${s[0]}</h3><div class="text-[#e5e5ea] whitespace-pre-wrap font-medium leading-relaxed text-[13px]">${s[1]}</div>${calc(s,i)}</div>`).join('')}</div>`;
}};

const TABS=[['dash','Resumo','home'],['cal','Calendário','cal'],['fin','Finanças','wal'],['food','Comida','cart'],['uni','Cadeiras','book']];
function render(){
  document.getElementById('view').innerHTML=views[tab]();
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="flex flex-col items-center w-full gap-1 ${tab===t[0]?'text-[#0a84ff]':'text-gray-500'}">${icon(t[2])}<span class="text-[10px] font-medium">${t[1]}</span></button>`).join('');
  const w=document.getElementById('workout');
  if(w)w.oninput=()=>{day().workout=w.value;save()};
  const n=document.getElementById('newTodo');
  if(n)n.onkeydown=e=>{if(e.key==='Enter')act('add')};
  document.querySelectorAll('details[data-d]').forEach(d=>{d.ontoggle=()=>{openD[d.dataset.d]=d.open}});
  document.querySelectorAll('[data-g]').forEach(el=>{el.oninput=()=>{const q=el.dataset.g.split('|'),nm=SUBJECTS[q[0]][0];(S.grades[nm]=S.grades[nm]||{})[q[1]]=el.value;save();document.getElementById('res_'+q[0]).innerHTML=gradeRes(nm)}});
}
function act(a,v){
  flash='';
  if(a==='creatine'||a==='gym'){day()[a]=!day()[a]}
  else if(a==='add'){const i=document.getElementById('newTodo');if(!i.value.trim())return;S.todos.unshift({id:Date.now(),text:i.value.trim(),done:false})}
  else if(a==='tog'){const t=S.todos.find(x=>x.id==v);if(t)t.done=!t.done}
  else if(a==='del'){S.todos=S.todos.filter(x=>x.id!=v)}
  else if(a==='fit'){const f=S.fl.find(x=>x.id==v);if(f)f.paid=!f.paid}
  else if(a==='delf'){S.fl=S.fl.filter(x=>x.id!=v)}
  else if(a==='addf'){const l=document.getElementById('fLabel').value.trim();if(!l)return;S.fl.push({id:Date.now(),label:l,paid:false})}
  else if(a==='addd'){const n=document.getElementById('dName').value.trim(),v2=parseFloat(document.getElementById('dAmt').value.replace(',','.')),ds=document.getElementById('dDesc').value.trim();if(!n||isNaN(v2)||v2<=0)return;S.debts.push({id:Date.now(),name:n,amount:Math.round(v2*100)/100,desc:ds})}
  else if(a==='deld'){S.debts=S.debts.filter(x=>x.id!=v)}
  else if(a==='adde'){const t=document.getElementById('eTitle').value.trim(),dt=document.getElementById('eDate').value,tm=document.getElementById('eTime').value;if(!t||!dt)return;S.events.push({id:Date.now(),date:dt,time:tm,title:t,done:false})}
  else if(a==='ev'){const e=S.events.find(x=>x.id==v);if(e)e.done=!e.done}
  else if(a==='gadd'){const nm=SUBJECTS[v][0],t=document.getElementById('gn_'+v).value.trim(),x=document.getElementById('gv_'+v).value.trim(),xn=parseFloat(x.replace(',','.'));if(!t||isNaN(xn)||xn<0||xn>20)return;const g=S.grades[nm]=S.grades[nm]||{};(g.dyn=g.dyn||[]).push({id:Date.now(),t,v:x})}
  else if(a==='gdel'){const q=v.split('|'),g=S.grades[SUBJECTS[q[0]][0]];if(g&&g.dyn)g.dyn=g.dyn.filter(x=>x.id!=q[1])}
  else if(a==='dele'){S.events=S.events.filter(x=>x.id!=v)}
  else if(a==='adds'){const i=document.getElementById('sItem');if(!i.value.trim())return;S.shop.push({id:Date.now(),text:i.value.trim(),done:false})}
  else if(a==='tgs'){const t=S.shop.find(x=>x.id==v);if(t)t.done=!t.done}
  else if(a==='dels'){S.shop=S.shop.filter(x=>x.id!=v)}
  else if(a==='clrs'){S.shop=S.shop.filter(x=>!x.done)}
  else if(a==='addm'){const n=document.getElementById('mName').value.trim();if(!n)return;S.dishes.push({id:Date.now(),name:n})}
  else if(a==='delm'){S.dishes=S.dishes.filter(x=>x.id!=v)}
  else if(a==='m2s'){const m=S.dishes.find(x=>x.id==v);if(m){let c=0;m.ing.split(',').map(s=>s.trim()).filter(Boolean).forEach((s,k)=>{if(!S.shop.some(x=>!x.done&&x.text.toLowerCase()===s.toLowerCase())){S.shop.push({id:Date.now()+k,text:s,done:false});c++}});flash=c?c+' ingrediente(s) adicionado(s) às compras':'Já estava tudo na lista'}}
  save();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();act(e.target.dataset.enter)}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){tab=t.dataset.tab;render();document.querySelector('main').scrollTo(0,0);return}
  const a=e.target.closest('[data-a]');
  if(a)act(a.dataset.a,a.dataset.v);
});
render();
// Sincronização: guarda tudo na conta (sobrevive a fechar a app)
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const r=db.doc('data/users/'+id+'/state');
  const snap=await r.get();
  if(snap.exists){
    const d=snap.data();
    if(d&&d.json){
      S=Object.assign({daily:{},todos:[],fit:{},ev:{}},JSON.parse(d.json));
      migrate();
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      render();
    }
    ref=r;
  }else{ref=r;push()}
}catch(e){}})();
</script>
</body>
</html>
